<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CHIRP</title>

  <link rel="stylesheet" href="css/tokens.css" />
  <link rel="stylesheet" href="css/fonts.css" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/hero.css" />

  <!-- The hero's heaviest frames, warmed up early so Beat 1 never pops in. -->
  <link rel="preload" as="image" href="assets/cover/bg_environment.png" fetchpriority="high" />
  <link rel="preload" as="image" href="assets/cover/disk_foreground.png" fetchpriority="high" />
  <link rel="preload" as="image" href="assets/cover/magnetar_core.png" fetchpriority="high" />
  <link rel="preload" as="image" href="assets/cover/jet_upper.png" />
  <link rel="preload" as="image" href="assets/cover/jet_lower.png" />
  <link rel="preload" as="image" href="assets/cover/cover_text_overlay.png" />
  <link rel="preload" as="image" href="assets/cover_nature.png" />

  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/gsap.min.js"></script>
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/ScrollTrigger.min.js"></script>
</head>
<body>
  <section class="hero" data-hero>
    <div class="hero-pin" data-hero-pin>

      <!-- Two independently-scaled elements, siblings so neither's
           transform touches the other:
             .hero-stage  — bg_environment + corner haze. Sized to
                            100vmax (== max(100vw,100vh)) so it always
                            covers the viewport — no bars, any aspect.
             .hero-engine — disk + magnetar + all four jet pieces +
                            the cover's text overlay, ONE rigid group.
                            Scaled independently of the stage (see
                            hero.js) so the disk sits small and
                            contained, matching cover_art.jpeg. Every
                            piece here shares a single parallax
                            transform applied to .hero-engine itself —
                            never one transform per child — so the
                            jets are physically fused to the disk at
                            every scroll position. -->
      <div class="hero-stage" data-hero-stage>
        <img class="hero-layer hero-layer--bg" data-hero-bg
             src="assets/cover/bg_environment.png" alt="" />
        <img class="hero-layer hero-layer--haze haze-1" src="assets/cover/haze_1.png" alt="" />
        <img class="hero-layer hero-layer--haze haze-2" src="assets/cover/haze_2.png" alt="" />
        <img class="hero-layer hero-layer--haze haze-3" src="assets/cover/haze_3.png" alt="" />
        <img class="hero-layer hero-layer--haze haze-4" src="assets/cover/haze_4.png" alt="" />
      </div>

      <div class="hero-engine" data-hero-engine>
        <img class="hero-layer hero-layer--jetglow jetglow-1" data-hero-jetglow-1
             src="assets/cover/jet_glow_1.png" alt="" />
        <img class="hero-layer hero-layer--jetglow jetglow-2" data-hero-jetglow-2
             src="assets/cover/jet_glow_2.png" alt="" />
        <img class="hero-layer hero-layer--jet-lower" data-hero-jet-lower
             src="assets/cover/jet_lower.png" alt="" />
        <img class="hero-layer hero-layer--disk" data-hero-disk
             src="assets/cover/disk_foreground.png" alt="" />
        <img class="hero-layer hero-layer--magnetar" data-hero-magnetar
             src="assets/cover/magnetar_core.png" alt="" />
        <img class="hero-layer hero-layer--jet-upper" data-hero-jet-upper
             src="assets/cover/jet_upper.png" alt="" />
        <!-- The authentic Nature masthead + cover text, transparent
             where the artwork shows through. Positioned at the exact
             crop this asset represents of the shared square canvas
             (see hero.css) so its negative space always registers
             over the live disk — this IS the cover reveal, not a
             crossfade to a flat image. -->
        <img class="hero-layer hero-layer--overlay" data-hero-overlay
             src="assets/cover/cover_text_overlay.png" alt=""
             role="img" aria-label="Nature magazine cover text: “Power Sourced — the extreme physics at the heart of superluminous supernovae,” 12 March 2026." />
      </div>

      <div class="hero-frame-bar hero-frame-bar--left" data-hero-bar="left"></div>
      <div class="hero-frame-bar hero-frame-bar--right" data-hero-bar="right"></div>
      <div class="hero-frame-bar hero-frame-bar--top" data-hero-bar="top"></div>
      <div class="hero-frame-bar hero-frame-bar--bottom" data-hero-bar="bottom"></div>

      <!-- The published cover, once assembly (overlay + bars) is
           complete: a single tail-end crossfade from the live
           stage+engine composition to this real, pixel-clean asset —
           see hero.js. Same source crop as the text overlay above, so
           it registers on the same pixels rather than jumping. -->
      <img class="hero-layer hero-layer--nature" data-hero-nature
           src="assets/cover_nature.png"
           alt="Nature magazine cover, 12 March 2026: “Power Sourced — the extreme physics at the heart of superluminous supernovae,” featuring the SN 2024afav accretion disk and relativistic jet." />

      <div class="hero-copy" data-hero-copy>
        <p class="hero-eyebrow">SN 2024AFAV</p>
        <h1 class="hero-title">The supernova that chirps.</h1>
        <p class="hero-dek">A dying star&rsquo;s light, oscillating faster and faster — the fingerprint of a newborn magnetar warping spacetime.</p>
      </div>

      <div class="hero-scrollcue" data-hero-scrollcue aria-hidden="true">
        <span class="hero-scrollcue__line"></span>
        <span class="hero-scrollcue__label">Scroll</span>
      </div>

      <p class="hero-caption" data-hero-caption>
        <a href="https://www.nature.com/nature/volumes/651/issues/8105" target="_blank" rel="noopener">
          Nature, vol.&nbsp;651 — 12 March 2026. Cover story.
        </a>
      </p>
    </div>

    <!-- Reduced-motion fallback: no pin, no scroll-jacking, no
         animation at all — a flat, static, maximally-robust preview
         (also cover_nature.png) for users who've asked for no motion,
         entirely separate from the live scroll sequence above. -->
    <div class="hero-static-resolve">
      <div class="hero-cover-frame--static">
        <img src="assets/cover_nature.png"
             alt="Nature magazine cover, 12 March 2026: “Power Sourced — the extreme physics at the heart of superluminous supernovae,” featuring the SN 2024afav accretion disk and relativistic jet." />
      </div>
      <p class="hero-caption hero-caption--static">
        <a href="https://www.nature.com/nature/volumes/651/issues/8105" target="_blank" rel="noopener">
          Nature, vol.&nbsp;651 — 12 March 2026. Cover story.
        </a>
      </p>
    </div>
  </section>

  <script type="module" src="js/main.js"></script>
</body>
</html>
